name: Default Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  default-tests:
    name: Python 3.13 default offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENVIRONMENT: test
      APP_LOG_LEVEL: WARNING
      DATABASE_URL: postgresql+asyncpg://ci_test:ci_test@127.0.0.1:5432/ci_test
      SQLALCHEMY_ECHO: "false"
      POOL_SIZE: "2"
      MAX_OVERFLOW: "0"
      DATABASE_HEALTHCHECK_TIMEOUT_SECONDS: "3"
      LLM_PROVIDER: mock
      LLM_DEFAULT_MODEL: mock-default
      LLM_TIMEOUT_SECONDS: "5"
      LLM_DEFAULT_TEMPERATURE: "0"
      LLM_DEFAULT_MAX_TOKENS: "128"
      LLM_INTEGRATION_ACKNOWLEDGE_COST: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run default offline test suite
        run: python -m pytest
