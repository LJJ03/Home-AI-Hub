name: home-ai-hub

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: home-ai-hub-backend:local
  env_file:
    - .env.docker
  environment:
    DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migration:
    <<: *backend-common
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  backend:
    <<: *backend-common
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.getenv('APP_PORT', '8000');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=2).close()
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
