[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-ai-hub-backend"
version = "0.1.0"
description = "Backend infrastructure for Home AI Hub"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.25,<2.0",
]

[project.scripts]
home-ai-hub-api = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "integration: requires an isolated PostgreSQL database",
    "llm_integration: requires explicit cost acknowledgement and real provider access",
]
pythonpath = ["."]
testpaths = ["tests"]
